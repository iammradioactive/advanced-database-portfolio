name: Portfolio 1 - Build and verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: Build database and test constraints
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Read repository files
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build and verify Lagoon Market
        run: python run_portfolio1.py --rebuild

      - name: Save execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: portfolio1-evidence
          path: portfolio1-run-evidence/
          if-no-files-found: warn
          retention-days: 14
